name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,models]"
          python -c "import photutils, astropy, numpy; print('photutils', photutils.__version__, 'astropy', astropy.__version__, 'numpy', numpy.__version__)"
      - name: Unit and end-to-end tests
        run: pytest --cov --cov-report=term

  science:
    name: demo and case studies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[models]"
      - name: Synthetic demo recovers the injected physics
        run: p2pl demo --out "$RUNNER_TEMP/demo" --theme light
      - name: GRB 221009A case study runs on the committed ZTF data
        run: python case_studies/grb221009a/analyze.py --results "$RUNNER_TEMP/cs" --figures "$RUNNER_TEMP/cs_fig"
      - name: GRB 210204A case study runs on the committed ZTF data
        run: python case_studies/grb210204a/analyze.py --results "$RUNNER_TEMP/cs2" --figures "$RUNNER_TEMP/cs2_fig"
      - name: GRB 210204A physical model (short chain)
        run: >-
          python case_studies/grb210204a/physical_model.py --lightcurve "$RUNNER_TEMP/cs2/lightcurve_ztf.csv"
          --results "$RUNNER_TEMP/cs2" --figures "$RUNNER_TEMP/cs2_fig" --steps 400
      - uses: actions/upload-artifact@v4
        with:
          name: science-outputs
          path: |
            ${{ runner.temp }}/demo/summary.json
            ${{ runner.temp }}/demo/figures
            ${{ runner.temp }}/cs
            ${{ runner.temp }}/cs2
